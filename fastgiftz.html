<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Gifts Store</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: #e0e0e0;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
      gap: 15px;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .logo span {
      color: #4caf50;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #1e1e1e;
      border-radius: 30px;
      padding: 8px 18px;
      border: 1px solid #333;
      flex: 1 1 300px;
      max-width: 400px;
    }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      width: 100%;
      padding: 8px 0;
      font-size: 15px;
    }
    .search-box input::placeholder {
      color: #777;
    }
    .search-box .icon {
      color: #777;
      margin-right: 10px;
    }

    .tabs {
      display: flex;
      gap: 25px;
      font-size: 14px;
      font-weight: 500;
      color: #888;
      border-bottom: 1px solid #222;
      padding-bottom: 12px;
      margin-bottom: 25px;
    }
    .tabs .active {
      color: #fff;
      border-bottom: 2px solid #4caf50;
      padding-bottom: 12px;
      margin-bottom: -13px;
    }

    .gifts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .gift-card {
      background: #181818;
      border-radius: 16px;
      padding: 18px 16px 16px;
      border: 1px solid #2a2a2a;
      transition: transform 0.15s, border-color 0.15s;
      display: flex;
      flex-direction: column;
    }
    .gift-card:hover {
      border-color: #444;
      transform: translateY(-2px);
    }

    .gift-icon {
      font-size: 36px;
      margin-bottom: 10px;
      line-height: 1;
    }
    .gift-name {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }
    .gift-attribute {
      font-size: 13px;
      color: #777;
      margin-bottom: 10px;
    }

    .gift-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      border-top: 1px solid #282828;
      padding-top: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .gift-price {
      font-weight: 600;
      color: #4caf50;
      font-size: 16px;
    }
    .gift-price small {
      font-weight: 400;
      color: #888;
      font-size: 12px;
      margin-left: 4px;
    }

    .gift-status {
      font-size: 13px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 20px;
      background: #282828;
      color: #aaa;
    }
    .gift-status.sold {
      background: #3a1a1a;
      color: #ff6b6b;
    }
    .gift-status.available {
      background: #1a3a1a;
      color: #6bff6b;
    }

    /* Кнопка "Купить" */
    .buy-btn {
      display: inline-block;
      background: #4caf50;
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      transition: background 0.2s;
      cursor: pointer;
      margin-top: 6px;
      width: 100%;
    }
    .buy-btn:hover {
      background: #43a047;
    }
    .buy-btn.disabled {
      background: #555;
      color: #999;
      pointer-events: none;
      cursor: default;
    }
    .buy-btn.disabled:hover {
      background: #555;
    }

    .loading, .error {
      text-align: center;
      padding: 60px 20px;
      font-size: 18px;
      color: #aaa;
    }
    .error {
      color: #ff6b6b;
    }

    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        align-items: stretch;
      }
      .search-box {
        max-width: 100%;
      }
      .tabs {
        gap: 15px;
        font-size: 13px;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">FRAG<span>MENT</span> <small style="font-size:14px;color:#888;font-weight:400;">Gifts</small></div>
      <div class="search-box">
        <span class="icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search gift name or attribute...">
      </div>
    </div>

    <div class="tabs">
      <span class="active">Gifts</span>
      <span>Usernames</span>
      <span>Numbers</span>
      <span>Stars</span>
      <span>Premium</span>
      <span>Ads</span>
    </div>

    <div id="giftsContainer">
      <div class="loading">Загрузка подарков...</div>
    </div>
  </div>

  <script>
    (function() {
      // ⚠️ ЗАМЕНИТЕ НА РЕАЛЬНУЮ ССЫЛКУ НА JSON
      const JSON_URL = 'https://danilkayt.github.io/fastflash/gifts.json';

      const container = document.getElementById('giftsContainer');
      const searchInput = document.getElementById('searchInput');

      let allGifts = [];
      let filteredGifts = [];

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function renderGifts(gifts) {
        if (!gifts || gifts.length === 0) {
          container.innerHTML = `<div class="loading" style="color:#888;">Подарков не найдено</div>`;
          return;
        }

        let html = '<div class="gifts-grid">';
        gifts.forEach(g => {
          const statusClass = g.sold ? 'sold' : 'available';
          const statusText = g.sold ? 'Продано' : 'В наличии';
          const price = g.price !== undefined ? g.price : '—';
          const icon = g.icon || '🎁';
          const attribute = g.attribute || `#${g.id}`;

          // Кнопка "Купить" – активна только если не продано
          const buyBtn = g.sold
            ? `<span class="buy-btn disabled">Продано</span>`
            : `<a href="https://telegram.dog/fastgiftzbot" target="_blank" class="buy-btn">Купить</a>`;

          html += `
            <div class="gift-card">
              <div class="gift-icon">${icon}</div>
              <div class="gift-name">${escapeHtml(g.name)}</div>
              <div class="gift-attribute">${escapeHtml(attribute)}</div>
              <div class="gift-footer">
                <div class="gift-price">${price} <small>₽</small></div>
                <div class="gift-status ${statusClass}">${statusText}</div>
              </div>
              ${buyBtn}
            </div>
          `;
        });
        html += '</div>';
        container.innerHTML = html;
      }

      function filterGifts(query) {
        if (!query.trim()) {
          filteredGifts = allGifts.slice();
        } else {
          const q = query.trim().toLowerCase();
          filteredGifts = allGifts.filter(g =>
            g.name.toLowerCase().includes(q) ||
            (g.attribute && g.attribute.toLowerCase().includes(q)) ||
            String(g.id).includes(q)
          );
        }
        renderGifts(filteredGifts);
      }

      async function loadGifts() {
        try {
          container.innerHTML = `<div class="loading">⏳ Загрузка...</div>`;
          const response = await fetch(JSON_URL);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          if (!Array.isArray(data)) throw new Error('JSON должен быть массивом');
          allGifts = data;
          filteredGifts = data.slice();
          renderGifts(filteredGifts);
        } catch (err) {
          console.error('Ошибка загрузки:', err);
          container.innerHTML = `<div class="error">❌ Не удалось загрузить данные. Проверьте ссылку на JSON и доступ к сети.</div>`;
        }
      }

      let searchTimer;
      searchInput.addEventListener('input', function() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          filterGifts(this.value);
        }, 300);
      });

      loadGifts();
    })();
  </script>
</body>
</html>
